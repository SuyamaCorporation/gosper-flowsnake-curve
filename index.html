<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ゴスパー曲線フラクタル描画</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4">
<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold text-center mb-1">ゴスパー曲線フラクタル描画</h1>
  <p class="text-center text-gray-400 text-sm mb-4">L-systemで生成する六角形ベースの空間充填フラクタル</p>

  <!-- Controls -->
  <div class="bg-gray-900 rounded-xl p-4 mb-4 flex flex-wrap gap-4 items-center">
    <div class="flex items-center gap-2">
      <label class="text-sm text-gray-300" for="levelSlider">レベル</label>
      <input type="range" id="levelSlider" min="1" max="5" value="3" class="w-28 accent-purple-500" aria-label="フラクタルレベル">
      <span id="levelVal" class="text-purple-300 font-bold w-4">3</span>
    </div>
    <div class="flex items-center gap-2">
      <label class="text-sm text-gray-300" for="speedSlider">速度</label>
      <input type="range" id="speedSlider" min="1" max="10" value="5" class="w-24 accent-blue-500" aria-label="アニメーション速度">
      <span id="speedVal" class="text-blue-300 font-bold w-4">5</span>
    </div>
    <button id="drawBtn" onclick="startDraw()" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded-lg text-sm font-medium" aria-label="描画開始">▶ 描画</button>
    <button onclick="stopAnim()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium" aria-label="停止">■ 停止</button>
    <button onclick="downloadPNG()" class="px-4 py-2 bg-green-700 hover:bg-green-600 rounded-lg text-sm font-medium" aria-label="PNGダウンロード">↓ PNG</button>
  </div>

  <!-- Canvas -->
  <div class="bg-gray-900 rounded-xl overflow-hidden mb-4">
    <canvas id="canvas" class="w-full block" style="aspect-ratio:1/1" aria-label="ゴスパー曲線の描画キャンバス"></canvas>
  </div>

  <!-- Info -->
  <div class="bg-gray-900 rounded-xl p-4 text-sm text-gray-400 space-y-1">
    <div><span class="text-purple-300 font-medium">L-systemルール:</span> A → A-B--B+A++AA+B- &nbsp;|&nbsp; B → +A-BB--B-A++A+B</div>
    <div id="infoText" class="text-gray-500">レベル3: セグメント数 <span id="segCount">-</span></div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let animId = null;
let drawing = false;

function resize() {
  const w = canvas.clientWidth;
  canvas.width = w;
  canvas.height = w;
}
resize();
window.addEventListener('resize', () => { resize(); renderStatic(); });

document.getElementById('levelSlider').addEventListener('input', e => {
  document.getElementById('levelVal').textContent = e.target.value;
  stopAnim();
  renderStatic();
});
document.getElementById('speedSlider').addEventListener('input', e => {
  document.getElementById('speedVal').textContent = e.target.value;
});

// Gosper L-system
// A → A-B--B+A++AA+B-
// B → +A-BB--B-A++A+B
// angle: 60 degrees
// initial: A, heading 0

function expand(level) {
  let s = 'A';
  for (let i = 0; i < level; i++) {
    let next = '';
    for (const c of s) {
      if (c === 'A') next += 'A-B--B+A++AA+B-';
      else if (c === 'B') next += '+A-BB--B-A++A+B';
      else next += c;
    }
    s = next;
  }
  return s;
}

function lsystemToPoints(str, stepSize) {
  const angle60 = Math.PI / 3;
  let x = 0, y = 0, angle = 0;
  const pts = [[x, y]];
  for (const c of str) {
    if (c === 'A' || c === 'B') {
      x += Math.cos(angle) * stepSize;
      y += Math.sin(angle) * stepSize;
      pts.push([x, y]);
    } else if (c === '+') {
      angle += angle60;
    } else if (c === '-') {
      angle -= angle60;
    }
  }
  return pts;
}

function fitPoints(pts, canvasW, canvasH, margin = 0.08) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const [x, y] of pts) {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  const marg = margin;
  const scaleX = canvasW * (1 - 2*marg) / (maxX - minX || 1);
  const scaleY = canvasH * (1 - 2*marg) / (maxY - minY || 1);
  const scale = Math.min(scaleX, scaleY);
  const offX = canvasW * marg + (canvasW * (1-2*marg) - (maxX-minX)*scale) / 2 - minX * scale;
  const offY = canvasH * marg + (canvasH * (1-2*marg) - (maxY-minY)*scale) / 2 - minY * scale;
  return pts.map(([x, y]) => [x * scale + offX, y * scale + offY]);
}

function getHSL(t) {
  const h = Math.round(t * 300);
  return `hsl(${h},90%,60%)`;
}

let currentPts = [];

function renderStatic() {
  stopAnim();
  const level = +document.getElementById('levelSlider').value;
  const str = expand(level);
  const rawPts = lsystemToPoints(str, 10);
  const pts = fitPoints(rawPts, canvas.width, canvas.height);
  currentPts = pts;
  updateInfo(pts.length - 1, level);
  drawFull(pts);
}

function drawFull(pts) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineWidth = Math.max(1, 2.5 - pts.length / 3000);
  for (let i = 1; i < pts.length; i++) {
    ctx.beginPath();
    ctx.strokeStyle = getHSL(i / pts.length);
    ctx.moveTo(pts[i-1][0], pts[i-1][1]);
    ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }
  // Draw endpoint
  ctx.beginPath();
  ctx.fillStyle = '#fff';
  ctx.arc(pts[pts.length-1][0], pts[pts.length-1][1], 3, 0, Math.PI*2);
  ctx.fill();
}

function startDraw() {
  stopAnim();
  const level = +document.getElementById('levelSlider').value;
  const str = expand(level);
  const rawPts = lsystemToPoints(str, 10);
  const pts = fitPoints(rawPts, canvas.width, canvas.height);
  currentPts = pts;
  updateInfo(pts.length - 1, level);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const speed = +document.getElementById('speedSlider').value;
  const batchSize = Math.max(1, Math.round(pts.length / 500 * speed));
  let i = 1;
  const lw = Math.max(1, 2.5 - pts.length / 3000);
  ctx.lineWidth = lw;

  function frame() {
    const end = Math.min(i + batchSize, pts.length);
    for (; i < end; i++) {
      ctx.beginPath();
      ctx.strokeStyle = getHSL(i / pts.length);
      ctx.moveTo(pts[i-1][0], pts[i-1][1]);
      ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();
    }
    // Moving dot
    if (i < pts.length) {
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.arc(pts[i-1][0], pts[i-1][1], 3, 0, Math.PI*2);
      ctx.fill();
      animId = requestAnimationFrame(frame);
    } else {
      animId = null;
    }
  }
  animId = requestAnimationFrame(frame);
}

function stopAnim() {
  if (animId) { cancelAnimationFrame(animId); animId = null; }
}

function updateInfo(segs, level) {
  document.getElementById('segCount').textContent = segs.toLocaleString();
  document.getElementById('infoText').innerHTML = `レベル${level}: セグメント数 <span id="segCount">${segs.toLocaleString()}</span> | 描画ポイント数 ${(segs+1).toLocaleString()}`;
}

function downloadPNG() {
  // Ensure rendered
  if (currentPts.length === 0) renderStatic();
  else drawFull(currentPts);
  const a = document.createElement('a');
  a.download = `gosper-level${document.getElementById('levelSlider').value}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

// Restore saved level/speed
const savedLevel = localStorage.getItem('gosper_level');
const savedSpeed = localStorage.getItem('gosper_speed');
if (savedLevel) { document.getElementById('levelSlider').value = savedLevel; document.getElementById('levelVal').textContent = savedLevel; }
if (savedSpeed) { document.getElementById('speedSlider').value = savedSpeed; document.getElementById('speedVal').textContent = savedSpeed; }
document.getElementById('levelSlider').addEventListener('change', e => localStorage.setItem('gosper_level', e.target.value));
document.getElementById('speedSlider').addEventListener('change', e => localStorage.setItem('gosper_speed', e.target.value));

// Initial render
renderStatic();
</script>
</body>
</html>
